<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            width: 320px;
            text-align: center;
        }

        h1 {
            color: #1d4ed8;
            font-size: 24px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #2563eb;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1e40af;
        }

        #result {
            margin-top: 20px;
            color: #166534;
            font-weight: bold;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Student Grade Calculator</h1>

        <p>Enter marks for 5 subjects (out of 100)</p>

        <input type="number" id="m1" placeholder="Subject 1 Marks">
        <input type="number" id="m2" placeholder="Subject 2 Marks">
        <input type="number" id="m3" placeholder="Subject 3 Marks">
        <input type="number" id="m4" placeholder="Subject 4 Marks">
        <input type="number" id="m5" placeholder="Subject 5 Marks">

        <button onclick="calculateGrade()">Calculate Result</button>

        <div id="result"></div>
    </div>

    <script>
        function calculateGrade() {
            let m1 = Number(document.getElementById("m1").value);
            let m2 = Number(document.getElementById("m2").value);
            let m3 = Number(document.getElementById("m3").value);
            let m4 = Number(document.getElementById("m4").value);
            let m5 = Number(document.getElementById("m5").value);

            let inputs = ["m1", "m2", "m3", "m4", "m5"];

            for (let id of inputs) {
                let value = document.getElementById(id).value;

                if (value === "" || Number(value) < 0 || Number(value) > 100) {
                    document.getElementById("result").innerHTML =
                        "Please enter marks between 0 and 100 in all subjects.";
                    return;
                }
            }

            let total = m1 + m2 + m3 + m4 + m5;
            let percentage = total / 5;
            let grade;

            if (percentage >= 90) {
                grade = "A+";
            } else if (percentage >= 80) {
                grade = "A";
            } else if (percentage >= 70) {
                grade = "B";
            } else if (percentage >= 60) {
                grade = "C";
            } else if (percentage >= 40) {
                grade = "D";
            } else {
                grade = "F";
            }

            document.getElementById("result").innerHTML =
                "Total Marks: " + total + " / 500<br>" +
                "Percentage: " + percentage.toFixed(2) + "%<br>" +
                "Grade: " + grade;
        }
    </script>

</body>
</html>
