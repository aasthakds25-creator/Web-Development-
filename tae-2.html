<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Learning Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-50">

    <header class="bg-blue-900 text-white text-center p-6">
        <h1 class="text-3xl font-bold">Dynamic Online Learning Dashboard</h1>
        <p class="mt-2">Welcome to Online Learning</p>
    </header>

    <div class="p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-5">My Courses</h2>

        <div class="flex flex-wrap gap-6">

            <div class="bg-white p-5 w-64 rounded-lg shadow-lg">
                <h3 class="text-xl font-bold mb-3">HTML & CSS</h3>
                <p class="mb-3">Progress: 80%</p>
                <div class="w-full bg-gray-200 rounded-full h-2 mb-4">
                    <div class="bg-blue-700 h-2 rounded-full w-4/5"></div>
                </div>
                <button class="bg-blue-900 text-white px-4 py-2 rounded">Continue</button>
            </div>

            <div class="bg-white p-5 w-64 rounded-lg shadow-lg">
                <h3 class="text-xl font-bold mb-3">JavaScript</h3>
                <p class="mb-3">Progress: 60%</p>
                <div class="w-full bg-gray-200 rounded-full h-2 mb-4">
                    <div class="bg-blue-700 h-2 rounded-full w-3/5"></div>
                </div>
                <button class="bg-blue-900 text-white px-4 py-2 rounded">Continue</button>
            </div>

            <div class="bg-white p-5 w-64 rounded-lg shadow-lg">
                <h3 class="text-xl font-bold mb-3">Database</h3>
                <p class="mb-3">Progress: 45%</p>
                <div class="w-full bg-gray-200 rounded-full h-2 mb-4">
                    <div class="bg-blue-700 h-2 rounded-full w-[45%]"></div>
                </div>
                <button class="bg-blue-900 text-white px-4 py-2 rounded">Continue</button>
            </div>

        </div>

        <h2 class="text-2xl font-bold text-gray-800 mt-10 mb-4">Learning Progress</h2>

        <div class="bg-white p-5 rounded-lg shadow-lg">
            <p class="text-lg mb-2">Courses Completed: <b>3</b></p>
            <p class="text-lg">Learning Hours: <b>24</b></p>
        </div>
    </div>

</body>
</html>
