<!DOCTYPE html>
<html>
<head>
    <title>Online Learning Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f5ff;
            margin: 0;
        }

        header {
            background: #243b6b;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 25px;
        }

        .cards {
            display: flex;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        button {
            background: #243b6b;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>Dynamic Online Learning Dashboard</h1>
    <p>Welcome to Online Learning</p>
</header>

<div class="container">

    <h2>My Courses</h2>

    <div class="cards">

        <div class="card">
            <h3>HTML & CSS</h3>
            <p>Progress: 80%</p>
            <button>Continue</button>
        </div>

        <div class="card">
            <h3>JavaScript</h3>
            <p>Progress: 60%</p>
            <button>Continue</button>
        </div>

        <div class="card">
            <h3>Database</h3>
            <p>Progress: 45%</p>
            <button>Continue</button>
        </div>

    </div>

    <h2>Learning Progress</h2>
    <p>Courses Completed: 3</p>
    <p>Learning Hours: 24</p>

</div>

</body>
</html>
