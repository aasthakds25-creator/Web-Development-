<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart Grocery Shop</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-green-600 text-white p-5">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row
                    justify-between items-center gap-4">

            <h1 class="text-3xl font-bold">FreshMart</h1>

            <input
                type="text"
                id="searchInput"
                placeholder="Search groceries..."
                class="p-3 rounded-lg text-black w-full sm:w-64"
            >

            <button
                onclick="toggleCart()"
                class="bg-white text-green-700 px-5 py-2 rounded-lg font-bold">
                Cart (<span id="cartCount">0</span>)
            </button>

        </div>
    </header>

    <main class="max-w-6xl mx-auto p-5">

        <!-- Categories -->
        <h2 class="text-2xl font-bold mb-4">Shop by Category</h2>

        <div class="flex flex-wrap gap-3 mb-6">
            <button onclick="filterCategory('All')"
                class="bg-green-600 text-white px-4 py-2 rounded-lg">
                All
            </button>

            <button onclick="filterCategory('Vegetables')"
                class="bg-white px-4 py-2 rounded-lg shadow">
                Vegetables
            </button>

            <button onclick="filterCategory('Fruits')"
                class="bg-white px-4 py-2 rounded-lg shadow">
                Fruits
            </button>

            <button onclick="filterCategory('Dairy')"
                class="bg-white px-4 py-2 rounded-lg shadow">
                Dairy
            </button>

            <button onclick="filterCategory('Snacks')"
                class="bg-white px-4 py-2 rounded-lg shadow">
                Snacks
            </button>
        </div>

        <!-- Products -->
        <h2 class="text-2xl font-bold mb-4">Our Products</h2>

        <div id="productGrid"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        </div>

        <!-- Shopping Cart -->
        <section id="cartSection"
            class="hidden bg-white rounded-xl shadow-lg p-5 mt-8">

            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">Shopping Cart</h2>

                <button onclick="toggleCart()"
                    class="text-red-600 font-bold">
                    Close
                </button>
            </div>

            <div id="cartItems"></div>

            <h3 class="text-xl font-bold mt-5">
                Total: ₹<span id="cartTotal">0</span>
            </h3>

            <button onclick="checkout()"
                class="bg-green-600 text-white px-5 py-3
                       rounded-lg mt-4 hover:bg-green-700">
                Checkout
            </button>

            <p id="checkoutMessage" class="text-green-700 mt-3"></p>
        </section>

    </main>

    <footer class="bg-gray-800 text-white text-center p-4 mt-10">
        © 2026 FreshMart Grocery Shop
    </footer>

    <script>
        const products = [
            {
                id: 1,
                name: "Fresh Tomatoes",
                category: "Vegetables",
                price: 40,
                emoji: "🍅"
            },
            {
                id: 2,
                name: "Potatoes",
                category: "Vegetables",
                price: 30,
                emoji: "🥔"
            },
            {
                id: 3,
                name: "Fresh Apples",
                category: "Fruits",
                price: 120,
                emoji: "🍎"
            },
            {
                id: 4,
                name: "Bananas",
                category: "Fruits",
                price: 50,
                emoji: "🍌"
            },
            {
                id: 5,
                name: "Milk",
                category: "Dairy",
                price: 60,
                emoji: "🥛"
            },
            {
                id: 6,
                name: "Cheese",
                category: "Dairy",
                price: 100,
                emoji: "🧀"
            },
            {
                id: 7,
                name: "Biscuits",
                category: "Snacks",
                price: 25,
                emoji: "🍪"
            },
            {
                id: 8,
                name: "Chips",
                category: "Snacks",
                price: 20,
                emoji: "🍟"
            }
        ];

        let cart = [];
        let selectedCategory = "All";

        const productGrid = document.getElementById("productGrid");
        const searchInput = document.getElementById("searchInput");

        function displayProducts() {
            const searchText = searchInput.value.toLowerCase();

            const filteredProducts = products.filter(product => {
                const matchesSearch =
                    product.name.toLowerCase().includes(searchText);

                const matchesCategory =
                    selectedCategory === "All" ||
                    product.category === selectedCategory;

                return matchesSearch && matchesCategory;
            });

            productGrid.innerHTML = "";

            if (filteredProducts.length === 0) {
                productGrid.innerHTML =
                    '<p class="text-gray-600">No products found.</p>';
                return;
            }

            filteredProducts.forEach(product => {
                const card = document.createElement("div");

                card.className =
                    "bg-white rounded-xl shadow-md p-5 text-center";

                card.innerHTML = `
                    <div class="text-6xl mb-3">${product.emoji}</div>

                    <h3 class="text-xl font-bold">
                        ${product.name}
                    </h3>

                    <p class="text-gray-500 mt-2">
                        ${product.category}
                    </p>

                    <p class="text-green-700 text-lg font-bold mt-2">
                        ₹${product.price}
                    </p>

                    <button
                        onclick="addToCart(${product.id})"
                        class="bg-green-600 text-white px-4 py-2
                               rounded-lg mt-4 hover:bg-green-700">
                        Add to Cart
                    </button>
                `;

                productGrid.appendChild(card);
            });
        }

        function filterCategory(category) {
            selectedCategory = category;
            displayProducts();
        }

        function addToCart(productId) {
            const existingItem =
                cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                const product =
                    products.find(item => item.id === productId);

                cart.push({
                    ...product,
                    quantity: 1
                });
            }

            updateCart();
        }

        function updateCart() {
            const cartItems = document.getElementById("cartItems");

            cartItems.innerHTML = "";

            let total = 0;
            let itemCount = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                itemCount += item.quantity;

                const row = document.createElement("div");

                row.className =
                    "flex flex-wrap justify-between items-center gap-3 border-b py-3";

                row.innerHTML = `
                    <span class="font-medium">
                        ${item.emoji} ${item.name}
                    </span>

                    <span>₹${item.price} × ${item.quantity}</span>

                    <div class="flex gap-2">
                        <button
                            onclick="changeQuantity(${item.id}, -1)"
                            class="bg-gray-200 px-3 py-1 rounded">
                            −
                        </button>

                        <button
                            onclick="changeQuantity(${item.id}, 1)"
                            class="bg-gray-200 px-3 py-1 rounded">
                            +
                        </button>

                        <button
                            onclick="removeItem(${item.id})"
                            class="bg-red-500 text-white px-3 py-1 rounded">
                            Delete
                        </button>
                    </div>
                `;

                cartItems.appendChild(row);
            });

            document.getElementById("cartCount").textContent = itemCount;
            document.getElementById("cartTotal").textContent = total;
        }

        function changeQuantity(productId, change) {
            const item = cart.find(item => item.id === productId);

            if (!item) return;

            item.quantity += change;

            if (item.quantity <= 0) {
                removeItem(productId);
            } else {
                updateCart();
            }
        }

        function removeItem(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }

        function toggleCart() {
            document.getElementById("cartSection")
                .classList.toggle("hidden");
        }

        function checkout() {
            const checkoutMessage =
                document.getElementById("checkoutMessage");

            if (cart.length === 0) {
                checkoutMessage.textContent =
                    "Your cart is empty!";
                return;
            }

            checkoutMessage.textContent =
                "Order placed successfully!";

            cart = [];
            updateCart();
        }

        searchInput.addEventListener("input", displayProducts);

        displayProducts();
    </script>

</body>
</html>
